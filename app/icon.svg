<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="mf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="mf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366F1" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#mf-grad)" />

  <!-- MediaDocks Emblem (Link + Downloader Stream) -->
  <g stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#mf-glow)">
    <!-- Left Link Loop -->
    <path d="M26 20h-4a9 9 0 0 0 0 18h4" />
    <!-- Right Link Loop -->
    <path d="M38 20h4a9 9 0 0 1 7.2 14.4" />
    <!-- Center Link Bar -->
    <path d="M24 29h16" />
    <!-- Download Stream Arrow -->
    <path d="M32 35v17" stroke-width="5" />
    <path d="M24 44l8 8 8-8" stroke-width="5" />
  </g>
</svg>
